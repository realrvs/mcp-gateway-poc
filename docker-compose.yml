services:

  # ─── PostgreSQL (audit log) ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mcp-postgres
    environment:
      POSTGRES_DB: mcp_audit
      POSTGRES_USER: mcp_user
      POSTGRES_PASSWORD: mcp_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp_user -d mcp_audit"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - mcp-network

  # ─── Mock EIS MCP Server ────────────────────────────────────────
  eis-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.eis
    container_name: eis-mcp-server
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - mcp-network

  # ─── MCP Gateway ────────────────────────────────────────────────
  mcp-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: mcp-gateway
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://mcp_user:mcp_password@postgres:5432/mcp_audit
      EIS_SERVER_URL: http://eis-mcp-server:8001
    depends_on:
      postgres:
        condition: service_healthy
      eis-mcp-server:
        condition: service_healthy
    networks:
      - mcp-network

volumes:
  pgdata:

networks:
  mcp-network:
    driver: bridge
